<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clothing Store Manager</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#7c2d5a">
<style>
:root{--p:#7c2d5a;--bg:#f6f4f5;--c:#fff;--t:#222;--b:#ddd}

*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{width:180px;background:var(--p);padding:10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}

main{flex:1;padding:14px;min-width:0;padding-bottom:70px}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:12px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.k{font-size:12px;opacity:.7}.v{font-size:21px;font-weight:700}
button.b{background:var(--p);color:#fff;border:0;padding:9px 14px;border-radius:6px;cursor:pointer;font-size:14px}button.b.big{padding:16px;font-size:18px}button.b.s{background:#666}button.b.r{background:#b3261e}
input,select,textarea{padding:8px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);font:inherit;max-width:100%}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.pc{cursor:pointer}.pc:hover{border-color:var(--p)}
.chip{padding:6px 12px;border-radius:16px;border:1px solid var(--p);cursor:pointer;background:var(--c)}.chip.on{background:var(--p);color:#fff}
#m{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:9}#m>div{background:var(--c);padding:16px;border-radius:10px;max-width:96vw;max-height:92vh;overflow:auto;min-width:300px}
#pr{display:none}.warn{color:#b3261e;font-weight:600}
@media(max-width:700px){body{display:block}nav{position:fixed;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;z-index:5;padding:2px;overflow-x:auto}nav button{padding:8px 6px;font-size:11px;white-space:nowrap}}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;color:#000;font:12px monospace;margin:0 auto}#pr table{width:100%}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="m" onclick="if(event.target==this)cm()"><div id="mb"></div></div><div id="pr"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['products','sales','expenses','stockLog','kv'],D={Men:['Shirts','T-Shirts','Jeans','Trousers','Kurtas','Shorts','Other'],Women:['Sarees','Kurtis','Dresses','Tops','Jeans','Leggings','Salwar Suits','Other']};

const rq=r=>new Promise((a,b)=>{r.onsuccess=()=>a(r.result);r.onerror=()=>b(r.error)});
const all=s=>rq(db.transaction(s).objectStore(s).getAll());
const put=(s,o)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);return new Promise((a,b)=>{t.oncomplete=a;t.onerror=()=>b(t.error)})};
const del=(s,k)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);return new Promise(a=>t.oncomplete=a)};
const fmt=n=>'₹'+(n/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),rs=x=>Math.round(parseFloat(x||0)*100),dk=t=>new Date(t).toLocaleDateString('en-CA'),uid=()=>crypto.randomUUID();
const cats=g=>D[g].concat((cfg.custom||{})[g]||[]);
function cm(){$('#m').style.display='none'}function sm(h){$('#mb').innerHTML=h;$('#m').style.display='flex'}
async function init(){
 db=await new Promise((a,b)=>{const q=indexedDB.open('clothstore',1);q.onupgradeneeded=()=>ST.forEach(s=>q.result.createObjectStore(s,{keyPath:s=='kv'?'k':'id'}));q.onsuccess=()=>a(q.result);q.onerror=()=>b(q.error)});
 cfg=await rq(db.transaction('kv').objectStore('kv').get('cfg'));
 if(!cfg){cfg={k:'cfg',name:'Sanskruti Collection',tag:'FASHION • STYLE • QUALITY',addr:'Beed Road Corner, Jamkhed',phone:'9421439234 | 9518327007',thx:'Thank you for shopping with us! Visit again ❤️',pol:'Exchange within 7 days with bill.',gstin:'',fmtI:'compact',gst:0,size:'80',low:5,pre:'INV-',next:1,custom:{Men:[],Women:[]},dark:0};await put('kv',cfg)}
 if(cfg.dark)document.body.setAttribute('data-d',1);
 navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
 $('#nav').innerHTML=[['dash','🏠 Home'],['bill','🧾 New Bill'],['prod','👕 Products'],['stock','📦 Stock'],['sales','📜 Sales'],['pay','💰 Collection'],['dlt','🗑 Deleted'],['exp','💸 Expenses'],['rep','📊 Reports'],['set','⚙️ Settings']].map(([k,l])=>`<button id="n_${k}" onclick="go('${k}')">${l}</button>`).join('');
 go('dash')}
async function go(v){V=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n_'+v));P=await all('products');await views[v]();window.scrollTo(0,0)}
const stt=s=>s.status=='cancelled'?'CANCELLED':s.due<=0?'PAID':s.paid<=0?'UNPAID':'PARTIALLY PAID';
const inv=s=>{const gs=cfg.gst>0,det=cfg.fmtI=='detailed',q=s.items.reduce((a,i)=>a+i.q,0);
return `${s.status=='cancelled'?'<h2 style="text-align:center;color:#b3261e;border:2px solid #b3261e;margin:2px">CANCELLED</h2>':''}${cfg.logo?`<center><img src="${cfg.logo}" style="max-height:60px"></center>`:''}<h3 style="text-align:center;margin:2px;text-transform:uppercase">${E(cfg.name)}</h3><div style="text-align:center">${E(cfg.tag||'')}<br>${E(cfg.addr)}<br>Mobile: ${E(cfg.phone)}${gs&&cfg.gstin?'<br>GSTIN: '+E(cfg.gstin):''}</div><hr><b>${gs?'TAX INVOICE':'BILL'}</b> ${s.id}<br>${new Date(s.ts).toLocaleString('en-IN')}<br>Customer: ${s.cust?E(s.cust)+' '+E(s.phone||''):'Walk-in Customer'}<hr><table>${det?'<tr><th>Item<th>Size/Col<th>Qty<th>Rate<th>Disc<th>Amt</tr>':''}${s.items.map(i=>det?`<tr><td>${E(i.n)}${i.pid?'<br><small>'+E(i.cat)+'</small>':''}<td>${i.pid?E(i.s)+'/'+E(i.c):''}<td>${i.q}<td>${fmt(i.p)}<td>${fmt(i.d)}<td>${fmt(i.q*i.p-i.d)}</tr>`:`<tr><td>${E(i.n)}<br><small>${i.pid?E(i.s)+'/'+E(i.c)+' ':''}×${i.q} @${fmt(i.p)}${i.d?' disc '+fmt(i.d):''}</small></td><td style="text-align:right">${fmt(i.q*i.p-i.d)}</td></tr>`).join('')}</table><hr>Total qty ${q}<br>Subtotal ${fmt(s.sub)}<br>${s.bd?'Bill discount -'+fmt(s.bd)+'<br>':''}${s.tax?'GST '+s.rate+'% '+fmt(s.tax)+'<br>':''}<div style="font-size:1.25em;font-weight:700;background:#0001;padding:3px">TOTAL ${fmt(s.total)}</div>${s.pays.map(p=>p.m+' '+fmt(p.amt)+(p.ref?' ('+E(p.ref)+')':'')).join('<br>')||'No payment'}<br>Paid ${fmt(s.paid)} | Outstanding ${fmt(s.due)}<br><b>Status: ${stt(s)}</b>${(s.rf||[]).map(x=>'<br>Refund '+fmt(x.amt)+' via '+x.m+' ('+new Date(x.ts).toLocaleDateString('en-IN')+')').join('')}${s.cancel?`<br>Cancelled ${new Date(s.cancel.ts).toLocaleString('en-IN')} — ${E(s.cancel.reason)} (goods ${s.cancel.restock?'restocked':'not restocked'})`:''}<hr><center>${E(cfg.thx||'Thank you!')}<br><small>${E(cfg.pol||'')}</small></center>`};
function showInv(id){all('sales').then(a=>{const s=a.find(x=>x.id==id),c=s.status=='cancelled';sm(`<div style="max-width:420px;font-family:monospace">${inv(s)}</div><div class="row"><input id="wn" placeholder="Customer mobile" value="${E(s.phone)}" inputmode="numeric" size="12"><button class="b" onclick="wa('${id}')">Share on WhatsApp</button></div><small>Opens WhatsApp with a ready message. Attach the PDF (Print → Save as PDF) and press Send yourself.</small><div class="row"><button class="b" onclick="prn('${id}')">Print / Save PDF</button>${c?'':(s.ret!==s.total?`<button class="b s" onclick="retForm('${id}')">Return</button>`:'')+`<button class="b r" onclick="window.cdel=0;cancelForm('${id}')">Cancel bill</button>`}${s.deleted?'':`<button class="b r" onclick="delBill('${id}')">Delete</button>`}<button class="b s" onclick="cm()">Close</button></div>`)})}
function wa(id){all('sales').then(a=>{const s=a.find(x=>x.id==id);let n=$('#wn').value.replace(/\D/g,'');if(n.length==10&&/^[6-9]/.test(n))n='91'+n;else if(!(n.length==12&&n.startsWith('91')&&/^[6-9]/.test(n[2])))return alert('Enter a valid 10-digit Indian mobile number');
 const m=`Hello! Thank you for shopping with us at ${cfg.name}.\n\nYour bill details:\nInvoice Number: ${s.id}\nDate: ${new Date(s.ts).toLocaleDateString('en-IN')}\nTotal Amount: ${fmt(s.total)}\nPayment Status: ${stt(s)}\n\nThank you for visiting our store. Visit again!`;window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank')})}
function prRep(){$('#pr').style.width='100%';$('#pr').innerHTML=$('#main').innerHTML;window.print()}
const getPays=()=>[['Cash','pc','pc'],['UPI','pu','ru'],['Bank Transfer','pb','rb']].map(([m,a,x])=>({m,amt:rs($('#'+a).value),ref:m=='Cash'?'':$('#'+x).value})).filter(p=>p.amt>0);
function previewBill(){if(!cart.length)return alert('Cart is empty');const t=T(),pays=getPays(),paid=pays.reduce((a,p)=>a+p.amt,0);sm(`<div style="max-width:420px;font-family:monospace">${inv({id:'PREVIEW',ts:Date.now(),cust:$('#cn').value,phone:$('#cp').value,items:cart,sub:t.sub,bd:t.bd,rate:cfg.gst,tax:t.tax,total:t.total,pays,paid,due:Math.max(0,t.total-paid)})}</div><button class="b s" onclick="cm()">Close</button>`)}
async function saveDraft(){if(!cart.length)return alert('Cart is empty');await put('kv',{k:'draft:'+uid(),ts:Date.now(),cart,cn:$('#cn').value,cp:$('#cp').value});cart=[];go('bill')}
function clearCart(){if(cart.length&&confirm('Delete this unfinished bill?')){cart=[];upd()}}
async function openDraft(k){if(cart.length&&!confirm('Replace the current cart?'))return;const d=await rq(db.transaction('kv').objectStore('kv').get(k));cart=d.cart;await del('kv',k);await go('bill');$('#cn').value=d.cn||'';$('#cp').value=d.cp||''}
function delDraft(k){if(confirm('Delete this draft bill?'))del('kv',k).then(()=>go('bill'))}
async function delBill(id){const a=await all('sales'),b=a.find(x=>x.id==id);
 if(b.status!='cancelled'){alert('This bill is still active, so it must be cancelled first. Fill in the cancellation details; the bill will then move to the Deleted tab.');window.cdel=1;return cancelForm(id)}
 const why=(prompt('Reason for deleting this bill (required)')||'').trim();if(!why)return;if(!confirm('Delete invoice '+id+'? It moves to the Deleted tab and stays on record.'))return;
 await put('sales',{...b,deleted:{ts:Date.now(),reason:why}});cm();go('sales')}
function cancelForm(id){all('sales').then(a=>{const s=a.find(x=>x.id==id),mx=s.paid-(s.ret||0);sm(`<b>Cancel bill ${id}</b><p>The invoice stays on record marked CANCELLED. Its number is never reused.</p><textarea id="cr" rows="2" placeholder="Reason (required)" style="width:100%"></textarea><label><input type="checkbox" id="crs"> Goods physically received back &amp; restockable (adds stock back)</label><div class="row">Refund ₹ <input id="cf" value="${mx/100}" size="8" inputmode="decimal"> via <select id="cmt"><option>Cash<option>UPI<option>Bank Transfer</select></div><small>Refund is recorded separately. Max ${fmt(mx)}; enter 0 for no refund.</small><div class="row"><button class="b r" onclick="doCancel('${id}')">Confirm cancellation</button><button class="b s" onclick="cm()">Back</button></div>`)})}
async function doCancel(id){const why=$('#cr').value.trim(),rf=rs($('#cf').value),rm=$('#cmt').value,rst=$('#crs').checked;if(!why)return alert('Enter a cancellation reason');if(rf<0)return alert('Invalid refund');if(!confirm('Cancel invoice '+id+'? This cannot be undone.'))return;
 const tx=db.transaction(['products','sales','stockLog'],'readwrite');try{const ss=tx.objectStore('sales'),s=await rq(ss.get(id)),now=Date.now();if(s.status=='cancelled')throw Error('Already cancelled');if(rf>s.paid-(s.ret||0))throw Error('Refund exceeds amount paid');
 if(rst)for(const l of s.items){const n=l.q-(l.rq||0);if(n<=0||!l.pid)continue;const p=await rq(tx.objectStore('products').get(l.pid)),v=p&&p.v.find(x=>x.s==l.s&&x.c==l.c);if(v){const b=v.q;v.q+=n;tx.objectStore('stockLog').put({id:uid(),ts:now,pid:p.id,n:p.name,s:l.s,c:l.c,before:b,add:n,sold:0,after:v.q,note:'Cancelled '+id});tx.objectStore('products').put(p)}}
 s.items.forEach(l=>l.rq=l.q);if(rf){s.rf=(s.rf||[]).concat({ts:now,amt:rf,m:rm,why:'Cancellation',type:'cancel'});s.ret=(s.ret||0)+rf}
 s.status='cancelled';s.cancel={ts:now,reason:why,restock:rst};if(window.cdel){s.deleted={ts:now,reason:why};window.cdel=0}ss.put(s);await new Promise((a,b)=>{tx.oncomplete=a;tx.onabort=()=>b(tx.error||Error('aborted'))});cm();go('sales')}catch(e){try{tx.abort()}catch(_){}alert('Not cancelled: '+e.message)}}
async function setLogo(f){if(!f)return;if(f.size>2e5)return alert('Logo must be under 200 KB');const d=await new Promise(a=>{const R=new FileReader();R.onload=()=>a(R.result);R.readAsDataURL(f)});cfg.logo=d;await put('kv',cfg);alert('Logo saved')}
function csvPay(){dl('collection.csv',csv([['Date','Invoice','Method','Amount','Type']].concat((window.pgRows||[]).map(e=>[e.d,e.id,e.m,e.a/100,e.rf?'Refund':'Received']))),'text/csv')}
function prn(id){all('sales').then(a=>{const s=a.find(x=>x.id==id);const w=cfg.size=='A4'?'190mm':cfg.size+'mm';$('#pr').style.width=w;$('#pr').innerHTML=inv(s);let st=document.getElementById('ps')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'ps'}));st.textContent=`@page{size:${cfg.size=='A4'?'A4':w+' auto'};margin:4mm}`;window.print()})}
const T=()=>{const sub=cart.reduce((a,i)=>a+i.q*i.p-i.d,0),bd=Math.min(rs($('#bd')?.value),sub),tx=sub-bd,tax=Math.round(tx*(cfg.gst||0)/100);return{sub,bd,tax,total:tx+tax}};
const views={
async dash(){const [S,X]=await Promise.all([all('sales'),all('expenses')]),td=dk(Date.now()),mo=td.slice(0,7);
 const ts=S.filter(s=>dk(s.ts)==td&&s.status!='cancelled'),pf=a=>a.reduce((x,s)=>x+s.rev-s.cogs-(s.rrev||0)+(s.rcogs||0),0),ex=X.filter(e=>e.date==td).reduce((a,e)=>a+e.amt,0);
 const low=[];P.forEach(p=>p.v.forEach(v=>{if(v.q<=(p.min??cfg.low))low.push(`${E(p.name)} ${E(v.s)}/${E(v.c)}: <b class="${v.q?'':'warn'}">${v.q?v.q+' left':'OUT'}</b>`)}));
 $('#main').innerHTML=`<h2>${E(cfg.name)}</h2><button class="b big" style="width:100%;margin-bottom:10px" onclick="go('bill')">🧾 NEW BILL</button><div class="row"><button class="b s" onclick="prodForm()">Add Product</button><button class="b s" onclick="go('stock')">Manage Stock</button><button class="b s" onclick="expForm()">Add Expense</button><button class="b s" onclick="go('rep')">Reports</button></div>
 <div class="g">${[['Products',P.length],['Stock',P.reduce((a,p)=>a+p.v.reduce((x,v)=>x+v.q,0),0)],["Today's Sales",fmt(ts.reduce((a,s)=>a+s.total-(s.ret||0),0))],["Today's Expenses",fmt(ex)],["Today's Profit",fmt(pf(ts)-ex)],['Month Sales',fmt(S.filter(s=>dk(s.ts).startsWith(mo)&&s.status!='cancelled').reduce((a,s)=>a+s.total-(s.ret||0),0))]].map(([k,v])=>`<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>
 <div class="card"><b>Low stock alerts (${low.length})</b><br>${low.join('<br>')||'None'}</div><div class="card"><b>Recent transactions</b><table>${S.filter(s=>!s.deleted).sort((a,b)=>b.ts-a.ts).slice(0,8).map(s=>`<tr onclick="showInv('${s.id}')" class="pc"><td>${s.id}</td><td>${E(s.cust)}</td><td>${fmt(s.total)}</td></tr>`).join('')}</table></div>
 ${Date.now()-(cfg.lastBk||0)>6048e5?'<div class="card warn">⚠ Take a backup (Settings → Backup). Data lives only on this device.</div>':''}`},
async bill(){const dr=(await all('kv')).filter(x=>x.k.startsWith('draft:')),cs=cats(pos.g);if(!pos.c)pos.c=cs[0];
 const list=P.filter(p=>p.gender==pos.g&&(pos.q?(p.name+p.code).toLowerCase().includes(pos.q.toLowerCase()):p.cat==pos.c));
 $('#main').innerHTML=`<div class="card"><b>Quick bill</b> — just type the item, quantity and rate<div class="row"><input id="qn" placeholder="Item (e.g. Jeans, T-Shirt)" style="flex:1;min-width:150px"><input id="qq" type="number" min="1" value="1" style="width:70px" title="Quantity"><input id="qr" placeholder="Rate ₹" inputmode="decimal" size="8" onkeydown="if(event.key=='Enter')addQ()"><button class="b" onclick="addQ()">Add</button></div></div>${dr.length?`<div class="card"><b>Saved drafts</b><table>${dr.map(d=>`<tr><td>${new Date(d.ts).toLocaleString('en-IN')}<td>${d.cart.length} items<td><button class="b s" onclick="openDraft('${d.k}')">Open</button> <button class="b r" onclick="delDraft('${d.k}')">Delete</button></tr>`).join('')}</table></div>`:''}<div class="row"><span class="chip ${pos.g=='Men'?'on':''}" onclick="rb(()=>{pos.g='Men';pos.c=null})">MEN'S</span><span class="chip ${pos.g=='Women'?'on':''}" onclick="rb(()=>{pos.g='Women';pos.c=null})">WOMEN'S</span><input id="q" placeholder="Search name/code" value="${E(pos.q)}" oninput="pos.q=this.value;clearTimeout(window.tq);window.tq=setTimeout(()=>{go('bill');setTimeout(()=>{const q=$('#q');q.focus();q.setSelectionRange(99,99)},50)},350)"></div>

 <div class="g">${list.map(p=>{const q=p.v.reduce((a,v)=>a+v.q,0);return`<div class="card pc" onclick="pick('${p.id}')"><b>${E(p.name)}</b><br><small>${E(p.code)}</small><br>${fmt(p.sell)}<br><small class="${q?'':'warn'}">Stock: ${q}</small></div>`}).join('')||'<i>No products</i>'}</div>
 <div class="card"><b>Cart</b><div id="cart"></div><div id="tot"></div></div>
 <div class="card"><div class="row"><input id="cn" placeholder="Customer name (optional)"><input id="cp" placeholder="Mobile (optional)" inputmode="numeric"><input id="bd" placeholder="Bill discount ₹" inputmode="decimal" oninput="upd()"></div>

 <div class="row"><input id="pb" placeholder="Bank ₹" inputmode="decimal" size="8"><input id="rb" placeholder="Bank name / ref no."></div>

async prod(){const q=(window.pq||'').toLowerCase();

 <div class="card" style="overflow:auto"><table><tr><th>Name<th>Code<th>Cat<th>Buy<th>Sell<th>Stock (size/colour)<th></tr>${P.filter(p=>(!window.pg||p.gender==window.pg)&&(p.name+p.code+p.cat).toLowerCase().includes(q)).map(p=>`<tr><td>${E(p.name)}<td>${E(p.code)}<td>${p.gender}/${E(p.cat)}<td>${fmt(p.buy)}<td>${fmt(p.sell)}<td>${p.v.map(v=>`${E(v.s)}/${E(v.c)}:${v.q}`).join(', ')}<td><button class="b s" onclick="prodForm('${p.id}')">Edit</button> <button class="b r" onclick="delProd('${p.id}')">Del</button></tr>`).join('')}</table></div>`},

 await new Promise((a,b)=>{tx.oncomplete=a;tx.onabort=()=>b(tx.error||Error('aborted'))});cm();alert('Refund to record: '+fmt(ref));go('sales')}catch(e){try{tx.abort()}catch(_){}alert(e.message)}}
function prodForm(id){const p=P.find(x=>x.id==id)||{gender:'Men',v:[],min:cfg.low},sel=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${E(x)}`).join('');
 sm(`<b>${id?'Edit':'Add'} product</b><div class="row"><input id="a1" placeholder="Name" value="${E(p.name)}"><input id="a2" placeholder="Code" value="${E(p.code)}"></div><div class="row"><select id="a3" onchange="$('#a4').innerHTML=cats(this.value).map(c=>'<option>'+c).join('')">${sel(['Men','Women'],p.gender)}</select><select id="a4">${sel(cats(p.gender),p.cat)}</select></div><div class="row"><input id="a5" placeholder="Purchase ₹" inputmode="decimal" value="${p.buy/100||''}"><input id="a6" placeholder="Selling ₹" inputmode="decimal" value="${p.sell/100||''}"><input id="a7" type="number" placeholder="Min stock" value="${p.min}"></div>Variants, one per line: <b>size,colour,qty</b><br><textarea id="a8" rows="6" cols="30">${p.v.map(v=>`${v.s},${v.c},${v.q}`).join('\n')}</textarea><div class="row"><button class="b" onclick="saveProd('${id||''}')">Save</button><button class="b s" onclick="cm()">Cancel</button></div>`)}
async function saveProd(id){const old=P.find(x=>x.id==id),v=[];const seen=new Set();
 for(const l of $('#a8').value.split('\n').filter(x=>x.trim())){const [s,c,q]=l.split(',').map(x=>x.trim()),n=parseInt(q);if(!s||!c||!(n>=0)||seen.has(s+'|'+c))return alert('Bad/duplicate variant line: '+l);seen.add(s+'|'+c);v.push({s,c,q:n})}
 const p={id:id||uid(),name:$('#a1').value.trim(),code:$('#a2').value.trim(),gender:$('#a3').value,cat:$('#a4').value,buy:rs($('#a5').value),sell:rs($('#a6').value),min:parseInt($('#a7').value)||0,v};
 if(!p.name||!p.code||!v.length||p.sell<=0||p.buy<0)return alert('Fill name, code, prices and at least one variant');
 if(P.some(x=>x.code==p.code&&x.id!=p.id))return alert('Product code already exists');
 const tx=db.transaction(['products','stockLog'],'readwrite');tx.objectStore('products').put(p);
 v.forEach(n=>{const o=old?.v.find(x=>x.s==n.s&&x.c==n.c),b=o?o.q:0;if(n.q!=b)tx.objectStore('stockLog').put({id:uid(),ts:Date.now(),pid:p.id,n:p.name,s:n.s,c:n.c,before:b,add:n.q-b,sold:0,after:n.q,note:old?'Edit':'Opening stock'})});
 await new Promise(a=>tx.oncomplete=a);cm();go('prod')}
function delProd(id){if(confirm('Delete this product? Past invoices keep their records.'))del('products',id).then(()=>go('prod'))}
function svs(){const p=P.find(x=>x.id==$('#sp')?.value);if($('#sv'))$('#sv').innerHTML=(p?p.v:[]).map((v,i)=>`<option value="${i}">${E(v.s)}/${E(v.c)} (${v.q})`).join('')}
async function adj(){const p=P.find(x=>x.id==$('#sp').value),v=p?.v[$('#sv').value],n=parseInt($('#sq').value);if(!v||!n)return alert('Enter a non-zero quantity');if(v.q+n<0)return alert('Stock cannot go negative');
 const b=v.q;v.q+=n;const tx=db.transaction(['products','stockLog'],'readwrite');tx.objectStore('products').put(p);tx.objectStore('stockLog').put({id:uid(),ts:Date.now(),pid:p.id,n:p.name,s:v.s,c:v.c,before:b,add:n,sold:0,after:v.q,note:$('#sn').value||(n>0?'Incoming':'Adjustment')});await new Promise(a=>tx.oncomplete=a);go('stock')}
function expForm(id){all('expenses').then(a=>{const e=a.find(x=>x.id==id)||{date:dk(Date.now()),cat:'Other Expenses',pm:'Cash'},o=(l,v)=>l.map(x=>`<option ${x==v?'selected':''}>${x}`).join('');
 sm(`<b>Expense</b><div class="row"><input id="e1" placeholder="Title" value="${E(e.title)}"><input id="e2" placeholder="Amount ₹" inputmode="decimal" value="${e.amt/100||''}"></div><div class="row"><select id="e3">${o(['Shop Rent','Electricity Bills','Transportation','Packaging','Employee Salary','Other Expenses'],e.cat)}</select><select id="e4">${o(['Cash','UPI','Bank Transfer'],e.pm)}</select><input type="date" id="e5" value="${e.date}"></div><input id="e6" placeholder="Description" value="${E(e.desc)}" style="width:100%"><div class="row"><button class="b" onclick="saveExp('${id||''}')">Save</button></div>`)})}
async function saveExp(id){const e={id:id||uid(),title:$('#e1').value.trim(),amt:rs($('#e2').value),cat:$('#e3').value,pm:$('#e4').value,date:$('#e5').value,desc:$('#e6').value};if(!e.title||e.amt<=0||!e.date)return alert('Enter title, positive amount and date');await put('expenses',e);cm();go(V=='dash'?'dash':'exp')}
async function saveSet(){Object.assign(cfg,{name:$('#s1').value,addr:$('#s2').value,phone:$('#s3').value,gst:parseFloat($('#s4').value)||0,low:parseInt($('#s5').value)||0,pre:$('#s6').value,next:Math.max(1,parseInt($('#s7').value)||1),size:$('#s8').value,tag:$('#t1').value,gstin:$('#t2').value,thx:$('#t3').value,pol:$('#t4').value,fmtI:$('#t5').value,dark:$('#s9').checked?1:0});document.body.toggleAttribute('data-d',!!cfg.dark);await put('kv',cfg);alert('Saved')}
async function addCat(){const n=$('#cn2').value.trim(),g=$('#cg').value;if(!n)return;(cfg.custom[g]=cfg.custom[g]||[]).push(n);await put('kv',cfg);alert('Added');go('set')}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
async function backup(){const o={};for(const s of ST)o[s]=await all(s);cfg.lastBk=Date.now();await put('kv',cfg);dl('store-backup-'+dk(Date.now())+'.json',JSON.stringify(o),'application/json')}
async function restore(f){if(!f||!confirm('This REPLACES all current data with the backup. Continue?'))return;try{const o=JSON.parse(await f.text());if(!ST.every(s=>Array.isArray(o[s])))throw Error('Not a valid backup');const tx=db.transaction(ST,'readwrite');ST.forEach(s=>{tx.objectStore(s).clear();o[s].forEach(r=>tx.objectStore(s).put(r))});await new Promise((a,b)=>{tx.oncomplete=a;tx.onabort=()=>b(tx.error)});cfg=await rq(db.transaction('kv').objectStore('kv').get('cfg'));alert('Restored');go('dash')}catch(e){alert('Restore failed: '+e.message)}}
const csv=rows=>rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
async function csvOf(s){const a=await all(s);const rows=s=='products'?[['Name','Code','Gender','Category','Buy','Sell','Size','Colour','Qty']].concat(a.flatMap(p=>p.v.map(v=>[p.name,p.code,p.gender,p.cat,p.buy/100,p.sell/100,v.s,v.c,v.q]))):[['Date','Title','Category','Method','Amount','Description']].concat(a.map(e=>[e.date,e.title,e.cat,e.pm,e.amt/100,e.desc]));dl(s+'.csv',csv(rows),'text/csv')}
async function csvSales(){const a=await all('sales');dl('sales.csv',csv([['Invoice','Date','Customer','Total','Paid','Due','Refunded','Methods']].concat(a.map(s=>[s.id,new Date(s.ts).toISOString(),s.cust,s.total/100,s.paid/100,s.due/100,(s.ret||0)/100,s.pays.map(p=>p.m).join('+')]))),'text/csv')}
init();
</script></body></html>
